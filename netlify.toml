[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- REGLAS CRÍTICAS DE PROXY PARA SHOPIFY (EVITAN EL BUCLE) ---
# Estas reglas fuerzan a Netlify a mostrar el contenido de Shopify
# sin redirigir al navegador, evitando el bucle 301.

# --- REGLAS CRÍTICAS DE PROXY PARA SHOPIFY (EVITAN EL BUCLE) ---
# Estas reglas fuerzan a Netlify a mostrar el contenido de Shopify
# sin redirigir al navegador, evitando el bucle 301.

[[redirects]]
  from = "/cart/*"
  to = "https://92542c-b5.myshopify.com/cart/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/checkouts/*"
  to = "https://92542c-b5.myshopify.com/checkouts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/wc/*"
  to = "https://92542c-b5.myshopify.com/wc/:splat"
  status = 200
  force = true

# --- REDIRECCIONES DE TU WEB ---

[[redirects]]
  from = "/about"
  to = "/es/nosotros"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/es/contacto"
  status = 301

[[redirects]]
  from = "/fit-finder"
  to = "/es/calculadora-de-tallas"
  status = 301

[[redirects]]
  from = "/checkout"
  to = "/es/pago"
  status = 301

[[redirects]]
  from = "/shipping"
  to = "/es/envios"
  status = 301

[[redirects]]
  from = "/returns"
  to = "/es/devoluciones"
  status = 301

[[redirects]]
  from = "/account"
  to = "/es/cuenta"
  status = 301

# --- REGLA FINAL: SPA CATCH-ALL ---
# Cualquier ruta que no sea un archivo o una regla anterior, carga React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- HEADERS DE CAHÉ (PREVIENEN ERROR DE CHUNKS PERDIDOS) ---
# Forzar validación siempre para HTML y JSON (evita index.html viejo)
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cachear assets inmutables por mucho tiempo (1 año)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
